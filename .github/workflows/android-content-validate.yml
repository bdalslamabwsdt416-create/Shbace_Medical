name: SHBACE Android Remote Content Validation

on:
  push:
    branches:
      - main
      - shbace-android-content
    paths:
      - 'android-content/**'
      - '.github/workflows/android-content-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-android-content-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout content package
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check validator syntax
        run: node --check android-content/validate.mjs

      - name: Verify content manifest, catalog, banks, media and flashcards
        run: node android-content/validate.mjs
