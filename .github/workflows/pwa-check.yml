name: PWA checks
on:
  pull_request:
    paths: ["to me/**"]
  push:
    branches-ignore: [main]
    paths: ["to me/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: to me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:bank
      - run: npm run build:pwa
