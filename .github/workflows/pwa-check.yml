name: PWA checks
on:
  pull_request:
    paths: ["to me/**", "for Computer/**", "for Chrome/**", "for ios/**", ".github/workflows/**"]
  push:
    branches-ignore: [main]
    paths: ["to me/**", "for Computer/**", "for Chrome/**", "for ios/**", ".github/workflows/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ["to me", "for Computer", "for Chrome"]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check:bank
      - run: npm run build:pwa

  analytics-rate-limit-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Redis CLI for the local REST adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools
      - name: Verify distributed Admin and ingestion quotas against Redis 7
        working-directory: to me
        env:
          NODE_ENV: test
          REDIS_PORT: 6379
        run: node --test tests/usage-analytics-rate-limit.integration.test.js

  analytics-postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shbace_analytics_test
          POSTGRES_USER: shbace_test
          POSTGRES_PASSWORD: shbace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shbace_test -d shbace_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply analytics schema twice (idempotency)
        env:
          PGPASSWORD: shbace_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test -f "to me/scripts/usage-analytics-schema.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test -f "to me/scripts/usage-analytics-schema.sql"
      - name: Verify schema, atomic ingestion, idempotency and retention
        env:
          PGPASSWORD: shbace_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test <<'SQL'
          SELECT 1 / (to_regclass('public.pwa_analytics_installs') IS NOT NULL)::int;
          SELECT 1 / (to_regclass('public.android_analytics_installs') IS NOT NULL)::int;
          SELECT 1 / (to_regclass('public.pwa_analytics_events') IS NOT NULL)::int;
          SELECT 1 / (to_regclass('public.android_analytics_events') IS NOT NULL)::int;
          SELECT 1 / ((SELECT count(*) FROM pg_constraint WHERE conname IN ('pwa_analytics_one_event_per_install_day','android_analytics_one_event_per_install_day')) = 2)::int;
          SELECT 1 / ((SELECT count(*) FROM pg_constraint WHERE conname IN ('pwa_analytics_events_install_id_fkey','android_analytics_events_install_id_fkey') AND condeferrable) = 2)::int;
          -- First activity creates the install and event atomically.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          SELECT 1 / ((SELECT count(*) FROM pwa_analytics_installs WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') = 1)::int;
          SELECT 1 / ((SELECT count(*) FROM pwa_analytics_events WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') = 1)::int;
          -- Retry same event ID: no duplicate.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          -- Different event ID on the same day: daily uniqueness suppresses it.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('22222222-2222-4222-8222-222222222222', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          SELECT 1 / ((SELECT count(*) FROM pwa_analytics_events WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') = 1)::int;
          SELECT 1 / ((SELECT count(*) FROM android_analytics_installs) = 0)::int;
          SELECT 1 / ((SELECT count(*) FROM android_analytics_events) = 0)::int;
          -- Both platform event tables support the documented retention cutoff.
          INSERT INTO pwa_analytics_installs VALUES ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', NOW() - INTERVAL '13 months', NOW() - INTERVAL '13 months');
          INSERT INTO pwa_analytics_events VALUES ('33333333-3333-4333-8333-333333333333', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', CURRENT_DATE - 400, NOW() - INTERVAL '13 months');
          INSERT INTO android_analytics_installs VALUES ('cccccccc-cccc-4ccc-8ccc-cccccccccccc', NOW() - INTERVAL '13 months', NOW() - INTERVAL '13 months');
          INSERT INTO android_analytics_events VALUES ('44444444-4444-4444-8444-444444444444', 'cccccccc-cccc-4ccc-8ccc-cccccccccccc', CURRENT_DATE - 400, NOW() - INTERVAL '13 months');
          DELETE FROM pwa_analytics_events WHERE occurred_at < NOW() - INTERVAL '12 months';
          DELETE FROM android_analytics_events WHERE occurred_at < NOW() - INTERVAL '12 months';
          SELECT 1 / (NOT EXISTS (SELECT 1 FROM pwa_analytics_events WHERE occurred_at < NOW() - INTERVAL '12 months'))::int;
          SELECT 1 / (NOT EXISTS (SELECT 1 FROM android_analytics_events WHERE occurred_at < NOW() - INTERVAL '12 months'))::int;
          SQL
      - name: Verify concurrent first-install ingestion
        env:
          PGPASSWORD: shbace_test
        run: bash "to me/scripts/test-analytics-concurrency.sh"
