name: PWA checks
on:
  pull_request:
    paths: ["to me/**", "for Computer/**", "for Chrome/**"]
  push:
    branches-ignore: [main]
    paths: ["to me/**", "for Computer/**", "for Chrome/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ["to me", "for Computer", "for Chrome"]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check:bank
      - run: npm run build:pwa

  analytics-postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shbace_analytics_test
          POSTGRES_USER: shbace_test
          POSTGRES_PASSWORD: shbace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shbace_test -d shbace_analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply analytics schema twice (idempotency)
        env:
          PGPASSWORD: shbace_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test -f "to me/scripts/usage-analytics-schema.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test -f "to me/scripts/usage-analytics-schema.sql"
      - name: Verify platform isolation and database constraints
        env:
          PGPASSWORD: shbace_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test <<'SQL'
          DO $
          BEGIN
            IF to_regclass('public.pwa_analytics_installs') IS NULL OR to_regclass('public.android_analytics_installs') IS NULL THEN
              RAISE EXCEPTION 'platform install tables are missing';
            END IF;
            IF to_regclass('public.pwa_analytics_events') IS NULL OR to_regclass('public.android_analytics_events') IS NULL THEN
              RAISE EXCEPTION 'platform event tables are missing';
            END IF;
            IF (SELECT count(*) FROM pg_constraint WHERE conname IN ('pwa_analytics_one_event_per_install_day','android_analytics_one_event_per_install_day')) <> 2 THEN
              RAISE EXCEPTION 'daily uniqueness constraints are missing';
            END IF;
            IF (SELECT count(*) FROM pg_constraint WHERE conname IN ('pwa_analytics_events_install_id_fkey','android_analytics_events_install_id_fkey') AND condeferrable) <> 2 THEN
              RAISE EXCEPTION 'deferred install foreign keys are missing';
            END IF;
          END $;
          SQL
      - name: Exercise atomic ingestion, idempotency and retention SQL
        env:
          PGPASSWORD: shbace_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U shbace_test -d shbace_analytics_test <<'SQL'
          -- First activity creates the install and event atomically.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          DO $
          BEGIN
            IF (SELECT count(*) FROM pwa_analytics_installs WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') <> 1 THEN
              RAISE EXCEPTION 'first PWA activity did not create install';
            END IF;
            IF (SELECT count(*) FROM pwa_analytics_events WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') <> 1 THEN
              RAISE EXCEPTION 'first PWA activity did not create event';
            END IF;
          END $;
          -- Retrying the same event is idempotent.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          -- A second event on the same install/day is suppressed.
          WITH inserted_event AS (
            INSERT INTO pwa_analytics_events (event_id, install_id, event_date, occurred_at)
            VALUES ('22222222-2222-4222-8222-222222222222', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', CURRENT_DATE, NOW())
            ON CONFLICT DO NOTHING RETURNING event_id, install_id, occurred_at
          ), upsert_install AS (
            INSERT INTO pwa_analytics_installs (install_id, first_seen_at, last_active_at)
            SELECT install_id, occurred_at, occurred_at FROM inserted_event
            ON CONFLICT (install_id) DO UPDATE SET last_active_at = GREATEST(COALESCE(pwa_analytics_installs.last_active_at, EXCLUDED.last_active_at), EXCLUDED.last_active_at)
            RETURNING install_id
          ), pruned_events AS (
            DELETE FROM pwa_analytics_events
            WHERE occurred_at < NOW() - INTERVAL '12 months' AND EXISTS (SELECT 1 FROM inserted_event)
            RETURNING event_id
          ) SELECT event_id FROM inserted_event;
          DO $
          BEGIN
            IF (SELECT count(*) FROM pwa_analytics_events WHERE install_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa') <> 1 THEN
              RAISE EXCEPTION 'event retry or daily limit was not idempotent';
            END IF;
            IF EXISTS (SELECT 1 FROM android_analytics_installs) OR EXISTS (SELECT 1 FROM android_analytics_events) THEN
              RAISE EXCEPTION 'PWA activity leaked into Android tables';
            END IF;
          END $;
          SQL
