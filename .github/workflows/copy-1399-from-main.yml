name: Copy 1.3.9.9 files from main (one-time)

on:
  push:
    branches: ["feature/to-me-final-enhancements-20261112"]
    paths:
      - ".github/workflows/copy-1399-from-main.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy the seven 1.3.9.9 files from main
        run: |
          set -e
          git fetch origin main
          git checkout origin/main -- \
            "to me/pwa-version.json" \
            "to me/sw.js" \
            "to me/scripts/build-pwa.mjs" \
            "to me/css/unified-enhancements.css" \
            "to me/js/13-home-functional-actions-v1.js" \
            "to me/js/09-app-features-v6.js" \
            "to me/js/35-pediatrics-collections.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply To Me 1.3.9.9 changed files"
          git push
