name: Generate npm lockfile for release branch
on:
  push:
    branches: ["shbace-release-1.3.10.35"]
    paths: ["to me/package.json"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile from pinned package.json
        working-directory: to me
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git status --porcelain -- "to me/package-lock.json" | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "to me/package-lock.json"
            git commit -m "build: add npm lockfile for reproducible installs"
            git push
          fi
