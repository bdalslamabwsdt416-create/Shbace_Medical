name: Move uploaded files (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move-uploaded-files.yml"

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into their folders
        run: |
          set -e
          cd "to me"
          mv -f 09-app-features-v6.js 13-home-functional-actions-v1.js 35-pediatrics-collections.js js/
          mv -f build-pwa.mjs scripts/
          mv -f unified-enhancements.css css/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "to me"
          git commit -m "Move uploaded files into js/, scripts/ and css/"
          git push
