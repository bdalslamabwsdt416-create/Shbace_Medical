name: Android debug APK

on:
  push:
    branches:
      - task1-onboarding-pwa-build-2026-11-10
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'img/**'
      - 'img1/**'
      - 'img2/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate changed JavaScript
        run: |
          node --check js/04-app-main.js
          node --check js/19-ob-shared-bg-v1-js.js

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shbace-Medical-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
