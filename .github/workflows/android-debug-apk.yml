name: Shbace Medical Android APK 1.1

on:
  push:
    branches:
      - apk-v1.1-copy-20261110
    paths:
      - 'android/**'
      - 'index.html'
      - 'www/**'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'img/**'
      - 'img1/**'
      - 'img2/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-android-1-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate application JavaScript
        run: |
          node --check js/06-drawer-menu.js
          node --check js/09-app-features-v6.js
          node --check js/20-drawer-order-v12.js
          node --check js/29-reviewed-bank-controls.js

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Copy web app into Android native assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shbace-Medical-APK-v1.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
