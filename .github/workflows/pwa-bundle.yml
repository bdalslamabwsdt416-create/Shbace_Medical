name: Shbace Medical PWA bundle

on:
  push:
    branches:
      - task1-onboarding-pwa-build-2026-11-10
      - fix/pwa-offline-onboarding-ui-20261110
      - release/pwa-v1.1-20261110
      - pwa-v1.1-copy-20261110
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'img/**'
      - 'img1/**'
      - 'img2/**'
      - 'fonts/**'
      - 'audio/**'
      - 'media/**'
      - 'videos/**'
      - 'documents/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/pwa-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate static PWA
        run: npm run build:pwa

      - name: Package PWA ZIP
        run: |
          cd www
          zip -qr ../Shbace-Medical-PWA-v1.1.zip .

      - name: Upload PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: Shbace-Medical-PWA-v1.1
          path: Shbace-Medical-PWA-v1.1.zip
          if-no-files-found: error
          retention-days: 90

# Rebuild the offline package whenever this workflow changes on the implementation branch.

# PWA 1.1 artifacts are versioned and never overwrite the earlier PWA bundle.
