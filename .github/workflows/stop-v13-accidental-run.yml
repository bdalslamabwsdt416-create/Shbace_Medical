name: Stop unintended v1.3 build
on:
  push:
    branches:
      - work/android-v1.3-planner-navigation-20261111
    paths:
      - '.github/workflows/stop-v13-accidental-run.yml'
permissions:
  contents: read
concurrency:
  group: shbace-android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded build without building the app
        run: echo "No app build or test is performed by this workflow."
