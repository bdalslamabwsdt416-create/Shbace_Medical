name: SHBACE Cloud Platform Validation
on:
  push:
    branches:
      - cloudflare/shbace-cloud-platform-v1
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-validate.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize the embedded admin page
        run: npm run sync:admin
      - name: Type-check Cloudflare Worker
        run: npm run check
