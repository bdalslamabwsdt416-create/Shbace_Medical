name: SHBACE Medical Android Release Pipeline

on:
  push:
    branches:
      - work/shbace-medical-1.1-copy-20261111
      - work/android-enhancements-20261111
      - work/android-v1.3-planner-navigation-20261111
      - work/android-notifications-fix-20261111
      - work/android-qtools-persistence-20261112
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shbace-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working copy
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
          node --check scripts/build-pwa.mjs

      - name: Build the matching PWA assets for Android
        run: npm run build:pwa

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.3.4-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Prepare Release signing key
        if: success() && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111' || github.ref == 'refs/heads/work/android-qtools-persistence-20261112')
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Debug APK was built; Release APK was skipped."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/shbace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: success() && steps.release-signing.outputs.ready == 'true' && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111' || github.ref == 'refs/heads/work/android-qtools-persistence-20261112')
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          printf '%s\\n' "$PERMISSIONS"
          for permission in android.permission.SCHEDULE_EXACT_ALARM android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED; do
            grep -Fq "$permission" <<< "$PERMISSIONS" || { echo "Missing permission: $permission"; exit 1; }
          done
          if grep -Fq android.permission.USE_EXACT_ALARM <<< "$PERMISSIONS"; then echo "Unexpected USE_EXACT_ALARM"; exit 1; fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Fq LocalNotificationRestoreReceiver
          BADGING=$("$AAPT" dump badging "$APK")
          grep -Fq "name='com.shbace.medical'" <<< "$BADGING" || { echo "Unexpected Android application ID"; exit 1; }
          grep -Fq "versionCode='13' versionName='1.3.4'" <<< "$BADGING" || { echo "Unexpected Android version metadata"; exit 1; }
          SIGNATURE_INFO=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\\n' "$SIGNATURE_INFO"
          grep -Fq "certificate SHA-256 digest: 8412e14418309829ca3d2432643672508ff5d6e9f00b727a3ce9654745a53337" <<< "$SIGNATURE_INFO" || { echo "Release signing certificate changed; refusing to publish an incompatible update"; exit 1; }

      - name: Publish signed Release APK
        if: success() && steps.release-signing.outputs.ready == 'true' && github.ref == 'refs/heads/work/android-qtools-persistence-20261112'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.3.4
          name: SHBACE Medical Android v1.3.4
          target_commitish: ${{ github.sha }}
          body: |
            Signed Android release build for SHBACE Medical v1.3.4 (versionCode 13).
            Includes persistent question tools, refined SVG action icons and a study-timer clock correction.
            The build runs Android unit tests and verifies the established release signing certificate before publishing.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties "$RUNNER_TEMP/shbace-release.jks"

# Release build trigger: user confirmed Actions signing secrets are configured.
