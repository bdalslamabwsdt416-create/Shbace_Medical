name: SHBACE Medical Android Release Pipeline

on:
  push:
    branches:
      - work/shbace-medical-1.1-copy-20261111
      - work/android-enhancements-20261111
      - work/android-v1.3-planner-navigation-20261111
      - work/android-notifications-fix-20261111
      - work/android-qtools-persistence-20261112
      - android/unified-to-me-20261117
      - android/rebuild-v1.3.6-from-to-me50-20261119
      - android/remote-content-engine-v1-20261119
      - android/remote-content-v2-1.3.7
      - android/universal-remote-control-1.3.7
      - android/settings-layout-1.3.8
      - android/apk-update-checker-1.3.9
      - android/fix-release-make-latest-string
      - android/core-module-registry-v1
      - android/freeze-existing-release-assets
      - android/navigation-route-contract-v1
      - integrate/for-apk-main-20261119
      - main
      - feat/basic-usage-analytics-20261121
      - fix/vercel-production-api-paths-20261122
    paths:
      - 'android/**'
      - 'for ApK/native/**'
      - 'to me/**'
      - 'api/**'
      - 'vercel.json'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'for ApK/native/**'
      - 'to me/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shbace-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working copy
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android and unified web dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix "to me" install --no-audit --no-fund

      - name: Unified web source checks and build
        run: |
          for file in "to me"/js/*.js; do
            node --check "$file"
          done
          node --check "to me/scripts/build-pwa.mjs"
          npm --prefix "to me" run test:unit
          npm --prefix "to me" run check:bank
          npm --prefix "to me" run build:pwa
          node --check "for ApK/android-content/validate.mjs"
          node "for ApK/android-content/validate.mjs"

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.3.9-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Prepare Release signing key
        if: success() && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111' || github.ref == 'refs/heads/work/android-qtools-persistence-20261112' || github.ref == 'refs/heads/android/unified-to-me-20261117' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integrate/for-apk-main-20261119' || github.ref == 'refs/heads/android/universal-remote-control-1.3.7' || github.ref == 'refs/heads/android/settings-layout-1.3.8' || github.ref == 'refs/heads/android/apk-update-checker-1.3.9')
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Debug APK was built; Release APK was skipped."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/shbace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: success() && steps.release-signing.outputs.ready == 'true' && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111' || github.ref == 'refs/heads/work/android-qtools-persistence-20261112' || github.ref == 'refs/heads/android/unified-to-me-20261117' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integrate/for-apk-main-20261119' || github.ref == 'refs/heads/android/universal-remote-control-1.3.7' || github.ref == 'refs/heads/android/settings-layout-1.3.8' || github.ref == 'refs/heads/android/apk-update-checker-1.3.9')
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          printf '%s\\n' "$PERMISSIONS"
          for permission in android.permission.SCHEDULE_EXACT_ALARM android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED; do
            grep -Fq "$permission" <<< "$PERMISSIONS" || { echo "Missing permission: $permission"; exit 1; }
          done
          if grep -Fq android.permission.USE_EXACT_ALARM <<< "$PERMISSIONS"; then echo "Unexpected USE_EXACT_ALARM"; exit 1; fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Fq LocalNotificationRestoreReceiver
          BADGING=$("$AAPT" dump badging "$APK")
          grep -Fq "name='com.shbace.medical'" <<< "$BADGING" || { echo "Unexpected Android application ID"; exit 1; }
          grep -Fq "versionCode='18' versionName='1.3.9'" <<< "$BADGING" || { echo "Unexpected Android version metadata"; exit 1; }
          SIGNATURE_INFO=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\\n' "$SIGNATURE_INFO"
          grep -Fq "certificate SHA-256 digest: 8412e14418309829ca3d2432643672508ff5d6e9f00b727a3ce9654745a53337" <<< "$SIGNATURE_INFO" || { echo "Release signing certificate changed; refusing to publish an incompatible update"; exit 1; }

      - name: Upload signed Release APK candidate
        if: success() && steps.release-signing.outputs.ready == 'true' && (github.ref == 'refs/heads/android/unified-to-me-20261117' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integrate/for-apk-main-20261119' || github.ref == 'refs/heads/android/universal-remote-control-1.3.7' || github.ref == 'refs/heads/android/settings-layout-1.3.8' || github.ref == 'refs/heads/android/apk-update-checker-1.3.9')
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.3.9-release-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish signed Android APK release
        if: success() && steps.release-signing.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          TAG="android-v${VERSION_NAME}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          # Never overwrite a published release when the application version is intentionally frozen.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Stable release ${TAG} already exists. Keeping its published APK/checksum unchanged."
            echo "A signed validation candidate is available in this workflow's Actions artifacts."
            exit 0
          fi

          RELEASE_JSON="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="SHBACE Medical Android v${VERSION_NAME}" \
            -f body="Signed Android APK release for SHBACE Medical v${VERSION_NAME}. Install this as an update over the existing app; keep the same package ID and signing certificate." \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          test -n "$RELEASE_ID"
          test "$RELEASE_ID" != "null"
          sha256sum "$APK" > "$APK.sha256"
          gh release upload "$TAG" "$APK#app-release.apk" "$APK.sha256#app-release.apk.sha256"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          echo "Published new stable release ${TAG} with a signed APK and SHA-256 checksum."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties "$RUNNER_TEMP/shbace-release.jks"

# Release build trigger: user confirmed Actions signing secrets are configured.

