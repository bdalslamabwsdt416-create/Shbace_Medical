name: SHBACE Medical Android APK 1.1 · Work Copy

on:
  push:
    branches:
      - work/shbace-medical-1.1-copy-20261111
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-android-v1.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working copy
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Build the matching PWA assets for Android
        run: npm run build:pwa

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.1-work-copy-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
