name: SHBACE Medical Android Release Pipeline

on:
  push:
    branches:
      - work/shbace-medical-1.1-copy-20261111
      - work/android-enhancements-20261111
      - work/android-v1.3-planner-navigation-20261111
      - work/android-notifications-fix-20261111
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'pwa-version.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shbace-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working copy
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          node --check js/09-app-features-v6.js
          node --check js/24-daily-notify-v18.js
          node --check js/30-android-enhancements.js
          node --check js/31-android-v13.js

      - name: Build the matching PWA assets for Android
        run: npm run build:pwa

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.3.2-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Prepare Release signing key
        if: always() && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111')
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Debug APK was built; Release APK was skipped."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/shbace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          cat > android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: always() && steps.release-signing.outputs.ready == 'true' && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111')
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          PERMISSIONS=$("$AAPT" dump permissions "$APK")
          printf '%s\\n' "$PERMISSIONS"
          for permission in android.permission.SCHEDULE_EXACT_ALARM android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED; do
            grep -Fq "$permission" <<< "$PERMISSIONS" || { echo "Missing permission: $permission"; exit 1; }
          done
          if grep -Fq android.permission.USE_EXACT_ALARM <<< "$PERMISSIONS"; then echo "Unexpected USE_EXACT_ALARM"; exit 1; fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Fq LocalNotificationRestoreReceiver
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed Release APK
        if: steps.release-signing.outputs.ready == 'true' && (github.ref == 'refs/heads/work/android-enhancements-20261111' || github.ref == 'refs/heads/work/android-v1.3-planner-navigation-20261111' || github.ref == 'refs/heads/work/android-notifications-fix-20261111')
        uses: actions/upload-artifact@v4
        with:
          name: SHBACE-Medical-Android-v1.3.2-RELEASE-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f android/keystore.properties "$RUNNER_TEMP/shbace-release.jks"

# Release build trigger: user confirmed Actions signing secrets are configured.
