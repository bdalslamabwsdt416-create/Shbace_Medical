name = "shbace-medical-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-11"
workers_dev = true

[assets]
directory = "./admin"
binding = "ASSETS"
run_worker_first = ["/v1/*"]

[vars]
APP_ORIGIN = "https://shbace-medical.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "shbace-medical-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BANKS"
bucket_name = "shbace-medical-content"

[[kv_namespaces]]
binding = "FLAGS"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

# Set ADMIN_API_TOKEN as a Worker secret; never commit it to this repository.
# wrangler secret put ADMIN_API_TOKEN
